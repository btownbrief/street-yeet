<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1d1a1a"/>
  <rect x="40" y="300" width="432" height="172" fill="#8a3a2a"/>
  <g fill="#b5332a"><rect x="40" y="300" width="432" height="14"/></g>
  <!-- brick pavers -->
  <g fill="#c96a3a" opacity=".5">
    <rect x="60" y="330" width="60" height="24"/><rect x="140" y="330" width="60" height="24"/><rect x="220" y="330" width="60" height="24"/><rect x="300" y="330" width="60" height="24"/><rect x="380" y="330" width="60" height="24"/>
  </g>
  <!-- flying creemee -->
  <g transform="rotate(24 300 190)">
    <path d="M300 150 l26 70 -52 0 z" fill="#d9a35a"/>
    <circle cx="300" cy="150" r="30" fill="#f6e7c6"/>
    <circle cx="300" cy="132" r="22" fill="#d9a35a"/>
  </g>
  <!-- motion lines -->
  <g stroke="#f2c744" stroke-width="12" stroke-linecap="round" opacity=".9">
    <line x1="150" y1="150" x2="215" y2="175"/><line x1="130" y1="205" x2="205" y2="215"/>
  </g>
  <!-- YEET wordmark -->
  <text x="256" y="440" font-family="Arial Black, Impact, sans-serif" font-size="118" font-weight="900" fill="#f2c744" text-anchor="middle" stroke="#7a1f1a" stroke-width="6" paint-order="stroke">YEET</text>
</svg>
